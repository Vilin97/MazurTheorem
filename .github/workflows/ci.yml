name: Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let the running main build finish so it can publish reusable caches. Stale
  # pull-request builds are still safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  LEAN_NUM_THREADS: "1"

jobs:
  source-policy:
    name: Source policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reject proof holes and policy backdoors
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/exposition")
          from generate import source_files, strip_comments_and_strings

          checks = (
              (re.compile(r"\b(?:sorry|admit|native_decide)\b"), "proof hole"),
              (
                  re.compile(
                      r"^\s*(?:axiom|constant|unsafe|partial)\b",
                      re.MULTILINE,
                  ),
                  "disallowed declaration",
              ),
              (
                  re.compile(r"^\s*set_option\b", re.MULTILINE),
                  "local option override",
              ),
              (
                  # Comments and strings are already masked, so this also
                  # catches nolint later in a multi-attribute list.
                  re.compile(r"\bnolint\b"),
                  "linter suppression",
              ),
          )
          failures = []
          root = Path.cwd()
          for path in source_files(root):
              masked = strip_comments_and_strings(path.read_text(encoding="utf-8"))
              for pattern, reason in checks:
                  for match in pattern.finditer(masked):
                      line = masked.count("\n", 0, match.start()) + 1
                      failures.append(f"{path}:{line}: {reason}: {match.group(0).strip()}")
          if failures:
              print("\n".join(failures))
              raise SystemExit("checked Lean sources violate the repository policy")
          PY

      - name: Check exposition generator syntax
        run: python3 -m py_compile scripts/exposition/generate.py

      - name: Validate roadmap, challenges, and source boundaries
        run: python3 scripts/quality.py

      - name: Validate the Order Seven cache manifest
        run: python3 scripts/order_seven_cache.py check

      - name: Validate the regular Lean cache manifests
        run: |
          python3 scripts/lean_regular_cache.py check
          python3 scripts/lean_audit_cache.py check

      - name: Validate the MazurTorsion linter ratchet
        run: python3 scripts/lint_changed_lean.py check

      - name: Protect immutable challenge contracts
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/check_challenge_immutability.py
          --base "${{ github.event.pull_request.base.sha }}"

  order-seven-cache:
    name: Cache the generated order-7 proof
    # Package writes stay disabled for ordinary pull-request events. A trusted
    # maintainer can dispatch a branch build to seed an exact cache before the
    # checked build, which is essential for unusually large generated changes.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs: source-policy
    uses: ./.github/workflows/order-seven-cache.yml
    permissions:
      contents: read
      packages: write

  heavy-certificate:
    name: Prebuild the generated order-27 certificate
    # Multi-gigabyte caches written from pull-request merge refs cannot be
    # reused by main or by other PRs. Let PR builds restore main's cache and
    # have Lake validate/rebuild any changed modules locally instead.
    # A trusted branch dispatch also needs this producer so Order Seven and
    # Order Twenty Seven can warm concurrently on separate runners.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: source-policy
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: order-27-cache-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Metadata-only probes keep an exact warm producer from downloading the
      # same 2.9 GB that the checked build consumes immediately afterwards.
      # These path lists deliberately match the payload restores byte-for-byte:
      # actions/cache includes them in its cache-version calculation.
      - name: Probe the final certificate cache
        id: final-certificate-cache-probe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySeven.*
          key: >-
            OrderTwentySevenFinal-v2-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/Kubert/OrderTwentySeven*.lean',
            'MazurTorsion/Kubert/OrderTwentySeven*/**/*.lean',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/NumberTheory/FermatCubicClassification.lean',
            'MazurTorsion/NumberTheory/XZeroTwentySevenClassification.lean'
            ) }}
          lookup-only: true

      - name: Probe the generated certificate cache
        id: generated-certificate-cache-probe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
          key: >-
            OrderTwentySevenLegChunks-v2-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean'
            ) }}
          lookup-only: true

      - name: Probe the certificate prerequisite cache
        id: certificate-prerequisite-cache-probe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
          key: >-
            OrderTwentySevenPrerequisites-v3-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**/*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.lean'
            ) }}
          lookup-only: true

      - name: Restore the final certificate cache
        if: >-
          steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true'
        id: final-certificate-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySeven.*
          key: >-
            OrderTwentySevenFinal-v2-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/Kubert/OrderTwentySeven*.lean',
            'MazurTorsion/Kubert/OrderTwentySeven*/**/*.lean',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/NumberTheory/FermatCubicClassification.lean',
            'MazurTorsion/NumberTheory/XZeroTwentySevenClassification.lean'
            ) }}
          restore-keys: |
            OrderTwentySevenFinal-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the generated certificate cache
        if: >-
          steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true'
        id: generated-certificate-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
          key: >-
            OrderTwentySevenLegChunks-v2-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean'
            ) }}
          restore-keys: |
            OrderTwentySevenLegChunks-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Lean
        if: >-
          steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true'
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Install the Mathlib cache
        if: >-
          steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true'
        run: scripts/get-mathlib-cache.sh

      - name: Build the generated certificate
        if: >-
          (steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true') &&
          steps.generated-certificate-cache.outputs.cache-hit != 'true'
        # The 24 leaf chunks fit four-at-a-time on a hosted runner. Keep the
        # downstream stage builders below serial: those are the memory-heavy
        # modules that cannot safely overlap.
        env:
          LEAN_NUM_THREADS: "4"
        run: |
          set -euo pipefail
          lake build MazurTorsion.Kubert.OrderTwentySevenLegChunks \
            2>&1 | tee heavy-certificate-build.log
          if grep -nE '(^|: )warning:' heavy-certificate-build.log; then
            echo "::error::The generated certificate build emitted warnings."
            exit 1
          fi
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.trace

      - name: Restore the certificate prerequisite cache
        if: >-
          steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true'
        id: certificate-prerequisite-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
          key: >-
            OrderTwentySevenPrerequisites-v3-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**/*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.lean'
            ) }}
          restore-keys: |
            OrderTwentySevenPrerequisites-v3-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the certificate prerequisites serially
        if: >-
          (steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true') &&
          steps.certificate-prerequisite-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          scripts/build-order-twenty-seven-stages.sh stage-a \
            2>&1 | tee certificate-stage-a-build.log
          scripts/build-order-twenty-seven-stages.sh stage-b-prerequisites \
            2>&1 | tee certificate-stage-b-prerequisites-build.log
          if grep -nE '(^|: )warning:' \
              certificate-stage-a-build.log \
              certificate-stage-b-prerequisites-build.log; then
            echo "::error::The certificate prerequisite build emitted warnings."
            exit 1
          fi

      - name: Save the certificate prerequisite cache
        if: >-
          (steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true') &&
          steps.certificate-prerequisite-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
          key: ${{ steps.certificate-prerequisite-cache.outputs.cache-primary-key }}

      - name: Build the final certificate stages serially
        if: >-
          (steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true') &&
          steps.final-certificate-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          scripts/build-order-twenty-seven-stages.sh final \
            2>&1 | tee certificate-final-build.log
          if grep -nE '(^|: )warning:' certificate-final-build.log; then
            echo "::error::The final certificate build emitted warnings."
            exit 1
          fi

      - name: Verify the final certificate cache
        if: >-
          steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true'
        run: |
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/Bezout.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/BigIdentity.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.olean

      - name: Save the final certificate cache
        if: >-
          (steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true') &&
          steps.final-certificate-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySeven.*
          key: ${{ steps.final-certificate-cache.outputs.cache-primary-key }}

  regular-cache:
    name: Cache the regular Lean library
    # Trusted branch dispatches seed the regular base and order-25 artifacts
    # beside the two generated-certificate producers. Ordinary PRs remain
    # read-only and consume only already-published caches.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs: source-policy
    uses: ./.github/workflows/regular-lean-cache.yml
    permissions:
      contents: read

  build:
    name: Build and lint Lean
    if: >-
      !cancelled() &&
      needs.source-policy.result == 'success' &&
      (needs.heavy-certificate.result == 'success' ||
      needs.heavy-certificate.result == 'skipped') &&
      (needs.order-seven-cache.result == 'success' ||
      needs.order-seven-cache.result == 'skipped') &&
      (needs.regular-cache.result == 'success' ||
      needs.regular-cache.result == 'skipped')
    needs:
      - source-policy
      - heavy-certificate
      - order-seven-cache
      - regular-cache
    runs-on: ubuntu-latest
    # A first cache-seeding build is intentionally allowed to finish. Warm
    # builds should be much shorter.
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    env:
      # The generated families are restored before this job. Use all hosted
      # runner CPUs for the small downstream build and validation tools.
      LEAN_NUM_THREADS: "4"
      # Cache-planning imports must not create runner-specific pyc files before
      # the exact validation key is computed.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Reclaim runner disk for the complete Lean environment
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          tool-cache: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The linter ratchet must see every path touched after its fixed
          # cutoff, including files later reverted to their cutoff contents.
          fetch-depth: 0

      - name: Plan the MazurTorsion linter ratchet
        id: linter-ratchet
        run: |
          set -euo pipefail
          {
            echo "digest=$(python3 scripts/lint_changed_lean.py digest)"
            echo "scripts=$(git ls-files --stage -z -- scripts | sha256sum | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Install Lean
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Install the Mathlib cache
        run: scripts/get-mathlib-cache.sh

      # Do not use lean-action's whole-.lake cache here. This repository's
      # generated artifacts are larger than GitHub's repository cache quota,
      # and auto-config is disabled above, so lean-action would save before the
      # manually scripted build. Keep the large stable families separate and
      # let the regular cache exclude them.
      - name: Restore the Tau Ceti build cache
        id: tau-ceti-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/packages/TauCeti/.lake/build/lib/lean
            .lake/packages/TauCeti/.lake/build/ir
          key: >-
            TauCetiBuild-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml')
            }}

      - name: Restore the order-25 build cache
        id: order-twenty-five-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentyFive*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentyFive*
          key: >-
            OrderTwentyFive-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml')
            }}-${{ hashFiles(
            'MazurTorsion/Kubert/OrderTwentyFive*.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/EllipticCurve/VariableChange.lean'
            ) }}
          restore-keys: |
            OrderTwentyFive-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Plan the regular Lean caches
        id: regular-plan
        run: |
          set -euo pipefail
          {
            echo "schema=$(python3 scripts/lean_regular_cache.py schema)"
            echo "digest=$(python3 scripts/lean_regular_cache.py digest)"
            echo "config=${{ hashFiles(
              'lean-toolchain',
              'lake-manifest.json',
              'lakefile.toml',
              'upstream/tauceti/lean-toolchain',
              'upstream/tauceti/lake-manifest.json',
              'scripts/lean_regular_cache.py'
              ) }}"
            echo "paths<<LEAN_CACHE_PATHS"
            python3 scripts/lean_regular_cache.py paths
            echo "LEAN_CACHE_PATHS"
            echo "downstream-paths<<LEAN_DOWNSTREAM_PATHS"
            python3 scripts/lean_regular_cache.py downstream-paths
            echo "LEAN_DOWNSTREAM_PATHS"
            echo "audit-schema=$(python3 scripts/lean_audit_cache.py schema)"
            echo "audit-digest=$(python3 scripts/lean_audit_cache.py digest)"
            echo "audit-paths<<LEAN_AUDIT_CACHE_PATHS"
            python3 scripts/lean_audit_cache.py paths
            echo "LEAN_AUDIT_CACHE_PATHS"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the regular Lean base cache
        id: regular-lean-base-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.regular-plan.outputs.paths }}
          key: >-
            LeanRegularBase-v${{ steps.regular-plan.outputs.schema }}-${{
            runner.os }}-${{ runner.arch }}-${{
            steps.regular-plan.outputs.config }}-${{
            steps.regular-plan.outputs.digest }}
          restore-keys: |
            LeanRegularBase-v${{ steps.regular-plan.outputs.schema }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.regular-plan.outputs.config }}-

      - name: Restore the regular Lean downstream cache
        id: regular-lean-downstream-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.regular-plan.outputs.downstream-paths }}
          key: >-
            LeanRegularDownstream-v${{ steps.regular-plan.outputs.schema }}-${{
            runner.os }}-${{ runner.arch }}-${{
            steps.regular-plan.outputs.config }}-${{ hashFiles(
            'MazurTorsion.lean',
            'MazurTorsion/**/*.lean',
            'EllipticCurves.lean',
            'EllipticCurves/**/*.lean',
            'upstream/tauceti/lean-toolchain',
            'upstream/tauceti/lake-manifest.json'
            ) }}
          restore-keys: |
            LeanRegularDownstream-v${{ steps.regular-plan.outputs.schema }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.regular-plan.outputs.config }}-

      - name: Restore the exhaustive-audit module cache
        id: audit-modules-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.regular-plan.outputs.audit-paths }}
          key: >-
            LeanAuditModules-v${{ steps.regular-plan.outputs.audit-schema }}-${{
            runner.os }}-${{ runner.arch }}-${{
            steps.regular-plan.outputs.audit-digest }}

      - name: Restore the exact validation attestation
        id: lean-validation-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci/lean-validation
          key: >-
            LeanValidation-v2-${{ runner.os }}-${{ runner.arch }}-${{
            steps.linter-ratchet.outputs.digest }}-${{
            steps.linter-ratchet.outputs.scripts }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'MazurTorsion.lean',
            'MazurTorsion/**/*.lean',
            'EllipticCurves.lean',
            'EllipticCurves/**/*.lean',
            'Challenge.lean',
            'Challenge/**/*.lean',
            'coordination/program.json',
            'upstream/tauceti/lean-toolchain',
            'upstream/tauceti/lake-manifest.json',
            '.github/workflows/ci.yml'
            ) }}

      - name: Complete the Tau Ceti dependency cache
        if: steps.tau-ceti-build-cache.outputs.cache-hit != 'true'
        run: lake build TauCeti

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Log in to the generated-proof cache
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Restore the generated Order Seven shards
        run: |
          set -euo pipefail
          df -h .
          restore_args=()
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ||
                ("$GITHUB_EVENT_NAME" == "push" &&
                 "$GITHUB_REF" == "refs/heads/main") ]]; then
            restore_args+=(--require-all)
          fi
          scripts/restore-order-seven-cache.sh "${restore_args[@]}"
          df -h .

      - name: Restore the final Order Seven bridge cache
        id: order-seven-bridge-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingObstruction.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantCertificate.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantFactors.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantObstruction.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantSymmetry.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingSymmetry.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingObstruction.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantCertificate.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantFactors.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantObstruction.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantSymmetry.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingSymmetry.*
          key: >-
            OrderSevenBridge-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'MazurTorsion/Kubert/OrderSeven*.lean',
            'MazurTorsion/EllipticCurve/DoublingCoordinates.lean',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/EllipticCurve/VeluPair.lean',
            'MazurTorsion/Foundations/DivisionPolynomialRootCriterion.lean',
            'MazurTorsion/Foundations/OddPrimeFullTorsion.lean',
            'MazurTorsion/Foundations/Polynomial/BoundedResultant.lean',
            'MazurTorsion/Foundations/ThreeTorsion.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean'
            ) }}

      - name: Restore the generated certificate cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
          key: >-
            OrderTwentySevenLegChunks-v2-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean'
            ) }}
          restore-keys: |
            OrderTwentySevenLegChunks-v2-${{ runner.os }}-${{ runner.arch }}-
          fail-on-cache-miss: >-
            ${{ github.ref == 'refs/heads/main' ||
            github.event_name == 'workflow_dispatch' }}

      - name: Restore the certificate prerequisite cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
          key: >-
            OrderTwentySevenPrerequisites-v3-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**/*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.lean'
            ) }}
          restore-keys: |
            OrderTwentySevenPrerequisites-v3-${{ runner.os }}-${{ runner.arch }}-
          fail-on-cache-miss: >-
            ${{ github.ref == 'refs/heads/main' ||
            github.event_name == 'workflow_dispatch' }}

      - name: Restore the final certificate cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySeven.*
          key: >-
            OrderTwentySevenFinal-v2-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/Kubert/OrderTwentySeven*.lean',
            'MazurTorsion/Kubert/OrderTwentySeven*/**/*.lean',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/NumberTheory/FermatCubicClassification.lean',
            'MazurTorsion/NumberTheory/XZeroTwentySevenClassification.lean'
            ) }}
          restore-keys: |
            OrderTwentySevenFinal-v2-${{ runner.os }}-${{ runner.arch }}-
          fail-on-cache-miss: >-
            ${{ github.ref == 'refs/heads/main' ||
            github.event_name == 'workflow_dispatch' }}

      - name: Verify the generated certificate caches
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.trace
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/Bezout.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/BigIdentity.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/NumeratorCube.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.olean

      - name: Build every checked Lean library
        run: |
          set -euo pipefail
          mapfile -t audit_targets < <(python3 scripts/lean_audit_cache.py targets)
          {
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ||
                  "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              # Non-main validation runs may only have an older certificate
              # cache. Finish its parallel-friendly data shards first, then
              # use the established serial builder for modules whose
              # elaboration can consume most of a hosted runner's memory.
              lake build MazurTorsion.Kubert.OrderTwentySevenLegChunks
              scripts/build-order-twenty-seven-stages.sh all
            fi
            lake build MazurTorsion EllipticCurves "${audit_targets[@]}"
          } 2>&1 | tee lean-build.log

      - name: Save the Tau Ceti build cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.tau-ceti-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/packages/TauCeti/.lake/build/lib/lean
            .lake/packages/TauCeti/.lake/build/ir
          key: ${{ steps.tau-ceti-build-cache.outputs.cache-primary-key }}

      - name: Save the order-25 build cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.order-twenty-five-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentyFive*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentyFive*
          key: ${{ steps.order-twenty-five-build-cache.outputs.cache-primary-key }}

      - name: Save the final Order Seven bridge cache
        if: >-
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch') &&
          steps.order-seven-bridge-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingObstruction.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantCertificate.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantFactors.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantObstruction.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantSymmetry.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingSymmetry.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingObstruction.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantCertificate.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantFactors.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantObstruction.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantSymmetry.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingSymmetry.*
          key: ${{ steps.order-seven-bridge-cache.outputs.cache-primary-key }}

      - name: Save the regular Lean downstream cache
        if: >-
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch') &&
          steps.regular-lean-downstream-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.regular-plan.outputs.downstream-paths }}
          key: ${{ steps.regular-lean-downstream-cache.outputs.cache-primary-key }}

      - name: Reject warnings from the checked Lean build
        run: |
          set -euo pipefail
          if grep -nE '(^|: )warning:' lean-build.log; then
            echo "::error::The checked Lean build emitted warnings."
            exit 1
          fi

      - name: Build registered challenges with exact expected notices
        if: steps.lean-validation-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          lake build Challenge 2>&1 | tee challenge-build.log
          expected=$(python3 - <<'PY'
          import json
          from pathlib import Path

          program = json.loads(Path("coordination/program.json").read_text())
          print(sum(
              1
              for node in program["nodes"]
              if isinstance(node.get("challenge"), dict)
              and node.get("status") in {"open", "paused", "research_open"}
              and node["challenge"]["file"].startswith("Challenge/")
          ))
          PY
          )
          actual=$(grep -c "declaration uses .*sorry" challenge-build.log || true)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::Expected $expected sorry notices, found $actual."
            exit 1
          fi
          if grep -E '(^|: )warning:' challenge-build.log \
              | grep -v "declaration uses .*sorry"; then
            echo "::error::Challenge build emitted an unexpected warning."
            exit 1
          fi

      - name: Audit kernel axiom dependencies
        if: steps.lean-validation-cache.outputs.cache-hit != 'true'
        run: lake exe axioms

      - name: Audit open and completed challenge contracts
        if: steps.lean-validation-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mapfile -t targets < <(python3 - <<'PY'
          import json
          from pathlib import Path

          program = json.loads(Path("coordination/program.json").read_text())
          for node in program["nodes"]:
              challenge = node.get("challenge")
              if not isinstance(challenge, dict):
                  continue
              if not challenge["file"].startswith("Challenge/"):
                  continue
              if node.get("status") in {"open", "paused", "research_open"}:
                  print(f"open:{challenge['declaration']}")
                  continue
              destination = challenge["destination_declaration"]
              print(f"closed:{challenge['declaration']}:{destination}")
              for consumer in challenge["consumer_declarations"]:
                  print(f"uses:{consumer}:{destination}")
          PY
          )
          lake exe contractAxioms "${targets[@]}"

      - name: Run Mathlib linter ratchet and clean-library linters
        if: steps.lean-validation-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          lint_cutoff="$(python3 scripts/lint_changed_lean.py cutoff)"
          if ! git cat-file -e "${lint_cutoff}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${lint_cutoff}"
          fi
          # This fixed cutoff explicitly grandfathers findings in never-touched
          # files. All default linters still run after a source change, every
          # touched file must be clean, and no nolint waiver is used.
          python3 scripts/lint_changed_lean.py enforce
          lake exe runLinter --no-build EllipticCurves
          lake exe runLinter --no-build Challenge

      - name: Run Mathlib style checks
        if: steps.lean-validation-cache.outputs.cache-hit != 'true'
        run: |
          lake exe lint-style MazurTorsion
          lake exe lint-style EllipticCurves
          lake exe lint-style Challenge

      - name: Record successful Lean validation
        if: >-
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch') &&
          steps.lean-validation-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci/lean-validation
          printf '%s\n' "$GITHUB_SHA" > .ci/lean-validation/SOURCE_SHA

      - name: Save the exact validation attestation
        if: >-
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch') &&
          steps.lean-validation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci/lean-validation
          key: ${{ steps.lean-validation-cache.outputs.cache-primary-key }}
