name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - "MazurTorsion.lean"
      - "MazurTorsion/**"
      - "EllipticCurves.lean"
      - "EllipticCurves/**"
      - "Challenge.lean"
      - "Challenge/**"
      - "blueprint/**"
      - "coordination/**"
      - "scripts/quality.py"
      - "scripts/build-order-twenty-seven-stages.sh"
      - "scripts/lean_regular_cache.py"
      - "scripts/order-seven-cache.sh"
      - "scripts/restore-order-seven-cache.sh"
      - "scripts/order_seven_cache.py"
      - "scripts/exposition/**"
      - "site/public/og.png"
      - "docbuild/**"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/pages.yml"
      - ".github/workflows/order-seven-cache.yml"
      - ".github/workflows/regular-lean-cache.yml"
      - ".github/actions/build-order-seven-shard/action.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  LEAN_NUM_THREADS: "1"

jobs:
  heavy-certificate:
    name: Prebuild the generated order-27 certificate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: order-27-cache-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Metadata-only probes keep an exact warm producer from downloading the
      # same 2.9 GB that the documentation consumer restores next.
      - name: Probe the final certificate cache
        id: final-certificate-cache-probe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySeven.*
          key: >-
            OrderTwentySevenFinal-v2-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/Kubert/OrderTwentySeven*.lean',
            'MazurTorsion/Kubert/OrderTwentySeven*/**/*.lean',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/NumberTheory/FermatCubicClassification.lean',
            'MazurTorsion/NumberTheory/XZeroTwentySevenClassification.lean'
            ) }}
          lookup-only: true

      - name: Probe the generated certificate cache
        id: generated-certificate-cache-probe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
          key: >-
            OrderTwentySevenLegChunks-v2-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean'
            ) }}
          lookup-only: true

      - name: Probe the certificate prerequisite cache
        id: certificate-prerequisite-cache-probe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
          key: >-
            OrderTwentySevenPrerequisites-v3-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**/*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.lean'
            ) }}
          lookup-only: true

      - name: Restore the final certificate cache
        if: >-
          steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true'
        id: final-certificate-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySeven.*
          key: >-
            OrderTwentySevenFinal-v2-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/Kubert/OrderTwentySeven*.lean',
            'MazurTorsion/Kubert/OrderTwentySeven*/**/*.lean',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/NumberTheory/FermatCubicClassification.lean',
            'MazurTorsion/NumberTheory/XZeroTwentySevenClassification.lean'
            ) }}
          restore-keys: |
            OrderTwentySevenFinal-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the generated certificate cache
        if: >-
          steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true'
        id: generated-certificate-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
          key: >-
            OrderTwentySevenLegChunks-v2-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean'
            ) }}
          restore-keys: |
            OrderTwentySevenLegChunks-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Lean
        if: >-
          steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true'
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Install the Mathlib cache
        if: >-
          steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true'
        run: lake exe cache get

      - name: Build the generated certificate
        if: >-
          (steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true') &&
          steps.generated-certificate-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          lake build MazurTorsion.Kubert.OrderTwentySevenLegChunks \
            2>&1 | tee heavy-certificate-build.log
          if grep -nE '(^|: )warning:' heavy-certificate-build.log; then
            echo "::error::The generated certificate build emitted warnings."
            exit 1
          fi
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.trace

      - name: Restore the certificate prerequisite cache
        if: >-
          steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true'
        id: certificate-prerequisite-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
          key: >-
            OrderTwentySevenPrerequisites-v3-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**/*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.lean'
            ) }}
          restore-keys: |
            OrderTwentySevenPrerequisites-v3-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the certificate prerequisites serially
        if: >-
          (steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true') &&
          steps.certificate-prerequisite-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          scripts/build-order-twenty-seven-stages.sh stage-a \
            2>&1 | tee certificate-stage-a-build.log
          scripts/build-order-twenty-seven-stages.sh stage-b-prerequisites \
            2>&1 | tee certificate-stage-b-prerequisites-build.log
          if grep -nE '(^|: )warning:' \
              certificate-stage-a-build.log \
              certificate-stage-b-prerequisites-build.log; then
            echo "::error::The certificate prerequisite build emitted warnings."
            exit 1
          fi

      - name: Save the certificate prerequisite cache
        if: >-
          (steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true') &&
          steps.certificate-prerequisite-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
          key: ${{ steps.certificate-prerequisite-cache.outputs.cache-primary-key }}

      - name: Build the final certificate stages serially
        if: >-
          (steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true') &&
          steps.final-certificate-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          scripts/build-order-twenty-seven-stages.sh final \
            2>&1 | tee certificate-final-build.log
          if grep -nE '(^|: )warning:' certificate-final-build.log; then
            echo "::error::The final certificate build emitted warnings."
            exit 1
          fi

      - name: Verify the final certificate cache
        if: >-
          steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true'
        run: |
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/Bezout.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/BigIdentity.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.olean

      - name: Save the final certificate cache
        if: >-
          (steps.final-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.generated-certificate-cache-probe.outputs.cache-hit != 'true' ||
          steps.certificate-prerequisite-cache-probe.outputs.cache-hit != 'true') &&
          steps.final-certificate-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySeven.*
          key: ${{ steps.final-certificate-cache.outputs.cache-primary-key }}

  order-seven-cache:
    name: Cache the generated order-7 proof
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/order-seven-cache.yml
    permissions:
      contents: read
      packages: write

  regular-cache:
    name: Cache the regular Lean library
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/regular-lean-cache.yml
    permissions:
      contents: read

  documentation:
    name: Build API documentation
    if: >-
      !cancelled() &&
      (needs.heavy-certificate.result == 'success' ||
      needs.heavy-certificate.result == 'skipped') &&
      (needs.order-seven-cache.result == 'success' ||
      needs.order-seven-cache.result == 'skipped') &&
      (needs.regular-cache.result == 'success' ||
      needs.regular-cache.result == 'skipped')
    needs:
      - heavy-certificate
      - order-seven-cache
      - regular-cache
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Reclaim runner disk for the complete Lean environment
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          tool-cache: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Restore documentation cache
        # Keep this restore-only: a per-commit doc-gen snapshot would compete
        # with the multi-gigabyte checked-proof caches for the 10 GB quota.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: docbuild/.lake/build
          key: Docs-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lean-toolchain', 'docbuild/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            Docs-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lean-toolchain', 'docbuild/lake-manifest.json') }}-

      - name: Install Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Install the Mathlib cache
        run: |
          if [ ! -d .lake/packages/mathlib ]; then
            lake exe cache get
          fi

      # Share the content-addressed root build caches with Core CI. The
      # documentation package depends on the root package through `../`, so a
      # doc build otherwise recompiles the full theorem library.
      - name: Restore the Tau Ceti build cache
        id: tau-ceti-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/packages/TauCeti/.lake/build/lib/lean
            .lake/packages/TauCeti/.lake/build/ir
          key: >-
            TauCetiBuild-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml')
            }}

      - name: Restore the order-25 build cache
        id: order-twenty-five-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentyFive*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentyFive*
          key: >-
            OrderTwentyFive-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml')
            }}-${{ hashFiles(
            'MazurTorsion/Kubert/OrderTwentyFive*.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/EllipticCurve/VariableChange.lean'
            ) }}
          restore-keys: |
            OrderTwentyFive-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Plan the regular Lean caches
        id: regular-plan
        run: |
          set -euo pipefail
          {
            echo "schema=$(python3 scripts/lean_regular_cache.py schema)"
            echo "digest=$(python3 scripts/lean_regular_cache.py digest)"
            echo "config=${{ hashFiles(
              'lean-toolchain',
              'lake-manifest.json',
              'lakefile.toml',
              'upstream/tauceti/lean-toolchain',
              'upstream/tauceti/lake-manifest.json',
              'scripts/lean_regular_cache.py'
              ) }}"
            echo "paths<<LEAN_CACHE_PATHS"
            python3 scripts/lean_regular_cache.py paths
            echo "LEAN_CACHE_PATHS"
            echo "downstream-paths<<LEAN_DOWNSTREAM_PATHS"
            python3 scripts/lean_regular_cache.py downstream-paths
            echo "LEAN_DOWNSTREAM_PATHS"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the regular Lean base cache
        id: regular-lean-base-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.regular-plan.outputs.paths }}
          key: >-
            LeanRegularBase-v${{ steps.regular-plan.outputs.schema }}-${{
            runner.os }}-${{ runner.arch }}-${{
            steps.regular-plan.outputs.config }}-${{
            steps.regular-plan.outputs.digest }}
          restore-keys: |
            LeanRegularBase-v${{ steps.regular-plan.outputs.schema }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.regular-plan.outputs.config }}-

      - name: Restore the regular Lean downstream cache
        id: regular-lean-downstream-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.regular-plan.outputs.downstream-paths }}
          key: >-
            LeanRegularDownstream-v${{ steps.regular-plan.outputs.schema }}-${{
            runner.os }}-${{ runner.arch }}-${{
            steps.regular-plan.outputs.config }}-${{ hashFiles(
            'MazurTorsion.lean',
            'MazurTorsion/**/*.lean',
            'EllipticCurves.lean',
            'EllipticCurves/**/*.lean',
            'upstream/tauceti/lean-toolchain',
            'upstream/tauceti/lake-manifest.json'
            ) }}
          restore-keys: |
            LeanRegularDownstream-v${{ steps.regular-plan.outputs.schema }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.regular-plan.outputs.config }}-

      - name: Complete the Tau Ceti dependency cache
        if: steps.tau-ceti-build-cache.outputs.cache-hit != 'true'
        run: lake build TauCeti

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Log in to the generated-proof cache
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Restore the generated Order Seven shards
        run: |
          set -euo pipefail
          df -h .
          restore_args=()
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            restore_args+=(--require-all)
          fi
          scripts/restore-order-seven-cache.sh "${restore_args[@]}"
          df -h .

      - name: Restore the final Order Seven bridge cache
        id: order-seven-bridge-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingObstruction.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantCertificate.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantFactors.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantObstruction.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantSymmetry.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingSymmetry.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingObstruction.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantCertificate.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantFactors.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantObstruction.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantSymmetry.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingSymmetry.*
          key: >-
            OrderSevenBridge-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'MazurTorsion/Kubert/OrderSeven*.lean',
            'MazurTorsion/EllipticCurve/DoublingCoordinates.lean',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/EllipticCurve/VeluPair.lean',
            'MazurTorsion/Foundations/DivisionPolynomialRootCriterion.lean',
            'MazurTorsion/Foundations/OddPrimeFullTorsion.lean',
            'MazurTorsion/Foundations/Polynomial/BoundedResultant.lean',
            'MazurTorsion/Foundations/ThreeTorsion.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean'
            ) }}

      - name: Restore the generated certificate cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
          key: >-
            OrderTwentySevenLegChunks-v2-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean'
            ) }}
          restore-keys: |
            OrderTwentySevenLegChunks-v2-${{ runner.os }}-${{ runner.arch }}-
          fail-on-cache-miss: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore the certificate prerequisite cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
          key: >-
            OrderTwentySevenPrerequisites-v3-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**/*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.lean'
            ) }}
          restore-keys: |
            OrderTwentySevenPrerequisites-v3-${{ runner.os }}-${{ runner.arch }}-
          fail-on-cache-miss: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore the final certificate cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySeven.*
          key: >-
            OrderTwentySevenFinal-v2-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'scripts/build-order-twenty-seven-stages.sh',
            'MazurTorsion/Kubert/OrderTwentySeven*.lean',
            'MazurTorsion/Kubert/OrderTwentySeven*/**/*.lean',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/NumberTheory/FermatCubicClassification.lean',
            'MazurTorsion/NumberTheory/XZeroTwentySevenClassification.lean'
            ) }}
          restore-keys: |
            OrderTwentySevenFinal-v2-${{ runner.os }}-${{ runner.arch }}-
          fail-on-cache-miss: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify the generated certificate caches
        if: github.ref == 'refs/heads/main'
        run: |
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.trace
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/Bezout.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/BigIdentity.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/NumeratorCube.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.olean

      - name: Build doc-gen4 site
        run: |
          set -euo pipefail
          cd docbuild
          lake build MazurTheoremDocs:docs
          test -s .lake/build/doc/index.html
          test -s .lake/build/doc/MazurTorsion.html
          test -s .lake/build/doc/EllipticCurves.html
          test -s .lake/build/doc/Challenge.html
          printf '%s\n' "$GITHUB_SHA" > .lake/build/doc/SOURCE_SHA

      - name: Save the Tau Ceti build cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.tau-ceti-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/packages/TauCeti/.lake/build/lib/lean
            .lake/packages/TauCeti/.lake/build/ir
          key: ${{ steps.tau-ceti-build-cache.outputs.cache-primary-key }}

      - name: Save the order-25 build cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.order-twenty-five-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentyFive*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentyFive*
          key: ${{ steps.order-twenty-five-build-cache.outputs.cache-primary-key }}

      - name: Save the final Order Seven bridge cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.order-seven-bridge-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingObstruction.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantCertificate.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantFactors.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantObstruction.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingResultantSymmetry.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderSevenBacktrackingSymmetry.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingObstruction.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantCertificate.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantFactors.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantObstruction.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingResultantSymmetry.*
            .lake/build/ir/MazurTorsion/Kubert/OrderSevenBacktrackingSymmetry.*
          key: ${{ steps.order-seven-bridge-cache.outputs.cache-primary-key }}

      - name: Save the regular Lean downstream cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.regular-lean-downstream-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.regular-plan.outputs.downstream-paths }}
          key: ${{ steps.regular-lean-downstream-cache.outputs.cache-primary-key }}

      - name: Upload documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-site
          path: docbuild/.lake/build/doc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  static:
    name: Build blueprint and exposition
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Restore the Verso dependency cache
        id: verso-dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: blueprint/.lake/packages
          key: >-
            VersoBlueprintDependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'blueprint/lean-toolchain',
            'blueprint/lakefile.lean',
            'blueprint/lake-manifest.json'
            ) }}

      - name: Validate canonical programme data
        run: python scripts/quality.py

      - name: Build and check the official Verso blueprint
        run: blueprint/scripts/ci-pages.sh

      - name: Save the Verso dependency cache
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.verso-dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: blueprint/.lake/packages
          key: ${{ steps.verso-dependency-cache.outputs.cache-primary-key }}

      - name: Assemble static site
        env:
          ROADMAP_SITE_URL: ${{ vars.ROADMAP_SITE_URL || 'https://github.com/Vilin97/MazurTheorem' }}
        run: |
          set -euo pipefail
          python scripts/exposition/generate.py \
            --repo-root . \
            --out pages-static \
            --commit "$GITHUB_SHA" \
            --roadmap-url "$ROADMAP_SITE_URL"
          test -s blueprint/_out/site/html-multi/index.html
          test -s site/public/og.png
          mkdir -p pages-static/blueprint
          cp -R blueprint/_out/site/html-multi/. pages-static/blueprint/
          cp site/public/og.png pages-static/og.png

      - name: Upload static site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-site
          path: pages-static
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs:
      - documentation
      - static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download static site
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: static-site
          path: site

      - name: Download documentation
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: documentation-site
          path: site/docs

      - name: Validate assembled Pages tree
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/blueprint/index.html
          test -s site/docs/index.html
          test -s site/exposition/index.html
          test -s site/og.png
          test "$(cat site/docs/SOURCE_SHA)" = "$GITHUB_SHA"
          jq -e --arg commit "$GITHUB_SHA" '
            .commit == $commit
            and .totals.modules > 0
            and .totals.declarations > 0
            and .totals.forbidden_holes == 0
          ' site/exposition/data/index.json > /dev/null
          mkdir -p site/deployments
          printf '%s\n' "$GITHUB_SHA" > "site/deployments/${GITHUB_SHA}.txt"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Verify the live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}"
          marker_url="${base_url}/deployments/${GITHUB_SHA}.txt"
          printf '%s\n' "$GITHUB_SHA" > expected-marker.txt
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "$marker_url" --output live-marker.txt
          cmp expected-marker.txt live-marker.txt
          for route in / /blueprint/ /docs/ /exposition/; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "${base_url}${route}" --output /dev/null
          done
