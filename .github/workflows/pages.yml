name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - "MazurTorsion.lean"
      - "MazurTorsion/**"
      - "EllipticCurves.lean"
      - "EllipticCurves/**"
      - "Challenge.lean"
      - "Challenge/**"
      - "blueprint/**"
      - "coordination/**"
      - "scripts/quality.py"
      - "scripts/build-order-twenty-seven-stages.sh"
      - "scripts/exposition/**"
      - "site/public/og.png"
      - "docbuild/**"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: "1"

jobs:
  heavy-certificate:
    name: Prebuild the generated order-27 certificate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: order-27-cache-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Restore the final certificate cache
        id: final-certificate-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySeven.*
          key: >-
            OrderTwentySevenFinal-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'MazurTorsion/**/*.lean'
            ) }}

      - name: Restore the generated certificate cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
          key: >-
            OrderTwentySevenLegChunks-${{ runner.os }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean'
            ) }}

      - name: Install Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Install the Mathlib cache
        run: lake exe cache get

      - name: Build the generated certificate
        run: |
          set -euo pipefail
          lake build MazurTorsion.Kubert.OrderTwentySevenLegChunks \
            2>&1 | tee heavy-certificate-build.log
          if grep -nE '(^|: )warning:' heavy-certificate-build.log; then
            echo "::error::The generated certificate build emitted warnings."
            exit 1
          fi
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.trace

      - name: Restore the certificate prerequisite cache
        id: certificate-prerequisite-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
          key: >-
            OrderTwentySevenPrerequisites-v2-${{ runner.os }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**/*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.lean'
            ) }}
          restore-keys: |
            OrderTwentySevenPrerequisites-v1-${{ runner.os }}-

      - name: Build the certificate prerequisites serially
        run: |
          set -euo pipefail
          scripts/build-order-twenty-seven-stages.sh stage-a \
            2>&1 | tee certificate-stage-a-build.log
          scripts/build-order-twenty-seven-stages.sh stage-b-prerequisites \
            2>&1 | tee certificate-stage-b-prerequisites-build.log
          if grep -nE '(^|: )warning:' \
              certificate-stage-a-build.log \
              certificate-stage-b-prerequisites-build.log; then
            echo "::error::The certificate prerequisite build emitted warnings."
            exit 1
          fi

      - name: Save the certificate prerequisite cache
        if: steps.certificate-prerequisite-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
          key: ${{ steps.certificate-prerequisite-cache.outputs.cache-primary-key }}

      - name: Build the final certificate stages serially
        if: steps.final-certificate-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          scripts/build-order-twenty-seven-stages.sh final \
            2>&1 | tee certificate-final-build.log
          if grep -nE '(^|: )warning:' certificate-final-build.log; then
            echo "::error::The final certificate build emitted warnings."
            exit 1
          fi

      - name: Verify the final certificate cache
        run: |
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/Bezout.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/BigIdentity.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.olean

      - name: Save the final certificate cache
        if: steps.final-certificate-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySeven.*
          key: ${{ steps.final-certificate-cache.outputs.cache-primary-key }}

  documentation:
    name: Build API documentation
    needs: heavy-certificate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Restore documentation cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: docbuild/.lake/build
          key: Docs-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lean-toolchain', 'docbuild/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            Docs-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lean-toolchain', 'docbuild/lake-manifest.json') }}-

      - name: Install Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Install the Mathlib cache
        run: |
          if [ ! -d .lake/packages/mathlib ]; then
            lake exe cache get
          fi

      - name: Restore the generated certificate cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegChunks.*
          key: >-
            OrderTwentySevenLegChunks-${{ runner.os }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean'
            ) }}
          fail-on-cache-miss: true

      - name: Restore the certificate prerequisite cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.*
          key: >-
            OrderTwentySevenPrerequisites-v2-${{ runner.os }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'MazurTorsion/EllipticCurve/VariableChange.lean',
            'MazurTorsion/Foundations/NaiveHeightDescent.lean',
            'MazurTorsion/Kubert/OrderEighteenModel.lean',
            'MazurTorsion/Kubert/OrderEighteenReduction.lean',
            'MazurTorsion/Kubert/OrderNineReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegChunks.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegs.lean',
            'MazurTorsion/Kubert/OrderTwentySevenReduction.lean',
            'MazurTorsion/Kubert/OrderTwentySevenTrisection.lean',
            'MazurTorsion/Kubert/TateNormalForm.lean',
            'MazurTorsion/Kubert/TateNormalFormMultiples.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesA/**/*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/T*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/W*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Bands*.lean',
            'MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Scalars.lean'
            ) }}
          fail-on-cache-miss: true

      - name: Restore the final certificate cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/MNum*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/DenominatorNonzero.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesC.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/**
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.*
            .lake/build/ir/MazurTorsion/Kubert/OrderTwentySeven.*
          key: >-
            OrderTwentySevenFinal-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'lean-toolchain',
            'lake-manifest.json',
            'lakefile.toml',
            'MazurTorsion/**/*.lean'
            ) }}
          fail-on-cache-miss: true

      - name: Verify the generated certificate caches
        run: |
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegChunks.trace
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/Bezout.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesD/BigIdentity.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesA/NumeratorCube.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/Zero.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenLegStagesB/KernelCubic.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySevenThirdLeg.olean
          test -s \
            .lake/build/lib/lean/MazurTorsion/Kubert/OrderTwentySeven.olean

      - name: Build doc-gen4 site
        run: |
          set -euo pipefail
          cd docbuild
          lake build MazurTheoremDocs:docs
          test -s .lake/build/doc/index.html
          test -s .lake/build/doc/MazurTorsion.html
          test -s .lake/build/doc/EllipticCurves.html
          test -s .lake/build/doc/Challenge.html
          printf '%s\n' "$GITHUB_SHA" > .lake/build/doc/SOURCE_SHA

      - name: Upload documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-site
          path: docbuild/.lake/build/doc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  static:
    name: Build blueprint and exposition
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install blueprint system packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz libgraphviz-dev pkg-config

      - name: Install pinned LeanBlueprint
        run: python -m pip install --disable-pip-version-check leanblueprint==0.0.20

      - name: Validate canonical programme data
        run: python scripts/quality.py

      - name: Build blueprint
        run: leanblueprint web

      - name: Assemble static site
        env:
          ROADMAP_SITE_URL: ${{ vars.ROADMAP_SITE_URL || 'https://github.com/Vilin97/MazurTheorem' }}
        run: |
          set -euo pipefail
          python scripts/exposition/generate.py \
            --repo-root . \
            --out pages-static \
            --commit "$GITHUB_SHA" \
            --roadmap-url "$ROADMAP_SITE_URL"
          test -s blueprint/web/index.html
          test -s site/public/og.png
          mkdir -p pages-static/blueprint
          cp -R blueprint/web/. pages-static/blueprint/
          cp site/public/og.png pages-static/og.png

      - name: Upload static site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-site
          path: pages-static
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs:
      - documentation
      - static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download static site
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: static-site
          path: site

      - name: Download documentation
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: documentation-site
          path: site/docs

      - name: Validate assembled Pages tree
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/blueprint/index.html
          test -s site/docs/index.html
          test -s site/exposition/index.html
          test -s site/og.png
          test "$(cat site/docs/SOURCE_SHA)" = "$GITHUB_SHA"
          jq -e --arg commit "$GITHUB_SHA" '
            .commit == $commit
            and .totals.modules > 0
            and .totals.declarations > 0
            and .totals.forbidden_holes == 0
          ' site/exposition/data/index.json > /dev/null
          mkdir -p site/deployments
          printf '%s\n' "$GITHUB_SHA" > "site/deployments/${GITHUB_SHA}.txt"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Verify the live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}"
          marker_url="${base_url}/deployments/${GITHUB_SHA}.txt"
          printf '%s\n' "$GITHUB_SHA" > expected-marker.txt
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "$marker_url" --output live-marker.txt
          cmp expected-marker.txt live-marker.txt
          for route in / /blueprint/ /docs/ /exposition/; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "${base_url}${route}" --output /dev/null
          done
