name: Quality and Site Preview

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "blueprint/**"
      - "coordination/**"
      - "scripts/exposition/**"
      - ".github/workflows/quality-site.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Browser app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    env:
      NODE_OPTIONS: "--max-old-space-size=3072"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test production rendering
        run: npm test

  static-preview:
    name: Blueprint and exposition
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install Lean
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Restore the Verso dependency cache
        id: verso-dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: blueprint/.lake/packages
          key: >-
            VersoBlueprintDependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles(
            'blueprint/lean-toolchain',
            'blueprint/lakefile.lean',
            'blueprint/lake-manifest.json'
            ) }}

      - name: Validate canonical programme data
        run: python scripts/quality.py

      - name: Build and check the official Verso blueprint
        run: blueprint/scripts/ci-pages.sh

      - name: Save the Verso dependency cache
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.verso-dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: blueprint/.lake/packages
          key: ${{ steps.verso-dependency-cache.outputs.cache-primary-key }}

      - name: Generate exposition
        env:
          ROADMAP_SITE_URL: ${{ vars.ROADMAP_SITE_URL || 'https://github.com/Vilin97/MazurTheorem' }}
        run: |
          python scripts/exposition/generate.py \
            --repo-root . \
            --out static-preview \
            --commit "$GITHUB_SHA" \
            --roadmap-url "$ROADMAP_SITE_URL"
          test -s blueprint/_out/site/html-multi/index.html
          test -s site/public/og.png
          mkdir -p static-preview/blueprint
          cp -R blueprint/_out/site/html-multi/. static-preview/blueprint/
          cp site/public/og.png static-preview/og.png

      - name: Validate preview
        run: |
          set -euo pipefail
          test -s static-preview/index.html
          test -s static-preview/blueprint/index.html
          test -s static-preview/exposition/index.html
          test -s static-preview/og.png
          jq -e --arg commit "$GITHUB_SHA" '
            .commit == $commit
            and .totals.modules > 0
            and .totals.declarations > 0
            and .totals.forbidden_holes == 0
          ' static-preview/exposition/data/index.json > /dev/null

      - name: Upload preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: static-preview
          path: static-preview
          if-no-files-found: error
          retention-days: 7
