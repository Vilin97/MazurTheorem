name: Cache the generated Order Seven proof

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  LEAN_NUM_THREADS: "2"

jobs:
  order-seven-seed:
    name: Seed the generated order-7 cache
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # Content keys keep old and new source revisions distinct. Serializing
      # the producer prevents Core and Pages from compiling the same cold seed.
      group: order-seven-seed
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate the shard manifest
        run: python3 scripts/order_seven_cache.py check

      - name: Build or restore the seed
        id: seed-cache
        uses: ./.github/actions/build-order-seven-shard
        with:
          shard: seed
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  order-seven-plan:
    name: Plan generated order-7 cache work
    needs: order-seven-seed
    if: >-
      (github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch') &&
      needs.order-seven-seed.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      all-hit: ${{ steps.plan.outputs.all-hit }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Log in to the generated-proof cache
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Probe the recurrence shards
        id: plan
        run: |
          set -euo pipefail
          all_hit=true
          while IFS= read -r shard; do
            if [[ "$shard" != "seed" ]] &&
                ! scripts/order-seven-cache.sh probe "$shard"; then
              echo "Cold Order Seven shard: $shard"
              all_hit=false
            fi
          done < <(python3 scripts/order_seven_cache.py lanes)
          echo "all-hit=$all_hit" >> "$GITHUB_OUTPUT"

  order-seven-small-shards:
    name: Build generated order-7 shard (${{ matrix.shard }})
    needs: order-seven-plan
    if: >-
      (github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch') &&
      needs.order-seven-plan.result == 'success' &&
      needs.order-seven-plan.outputs.all-hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: order-seven-${{ matrix.shard }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        shard:
          - factor
          - auxiliary
          - r0
          - r1
          - r6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build or restore the shard
        uses: ./.github/actions/build-order-seven-shard
        with:
          shard: ${{ matrix.shard }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  order-seven-bases:
    name: Build generated order-7 base (${{ matrix.shard }})
    needs: order-seven-plan
    if: >-
      (github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch') &&
      needs.order-seven-plan.result == 'success' &&
      needs.order-seven-plan.outputs.all-hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: order-seven-${{ matrix.shard }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        shard:
          - r2-base-a
          - r2-base-b
          - r2-base-c
          - r4-base-a
          - r4-base-b
          - r4-base-c
          - r5-base-a
          - r5-base-b
          - r5-base-c
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build or restore the base
        uses: ./.github/actions/build-order-seven-shard
        with:
          shard: ${{ matrix.shard }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  order-seven-products:
    name: Build generated order-7 products (${{ matrix.shard }})
    needs:
      - order-seven-plan
      - order-seven-bases
    if: >-
      (github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch') &&
      needs.order-seven-plan.outputs.all-hit != 'true' &&
      needs.order-seven-bases.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: order-seven-${{ matrix.shard }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        shard:
          - r2-products-a
          - r2-products-b
          - r4-products-a
          - r4-products-b
          - r5-products-a
          - r5-products-b
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build or restore the products
        uses: ./.github/actions/build-order-seven-shard
        with:
          shard: ${{ matrix.shard }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  order-seven-scalars:
    name: Build generated order-7 scalars (${{ matrix.shard }})
    needs:
      - order-seven-plan
      - order-seven-products
    if: >-
      (github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch') &&
      needs.order-seven-plan.outputs.all-hit != 'true' &&
      needs.order-seven-products.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    concurrency:
      group: order-seven-${{ matrix.shard }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        shard:
          - r2-scalars-0
          - r2-scalars-1
          - r2-scalars-2
          - r2-scalars-3
          - r2-scalars-4
          - r2-scalars-5
          - r2-scalars-6
          - r2-scalars-7
          - r4-scalars-0
          - r4-scalars-1
          - r4-scalars-2
          - r4-scalars-3
          - r4-scalars-4
          - r4-scalars-5
          - r4-scalars-6
          - r4-scalars-7
          - r4-scalars-8
          - r4-scalars-9
          - r4-scalars-10
          - r5-scalars-0
          - r5-scalars-1
          - r5-scalars-2
          - r5-scalars-3
          - r5-scalars-4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build or restore the scalars
        uses: ./.github/actions/build-order-seven-shard
        with:
          shard: ${{ matrix.shard }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  order-seven-finals:
    name: Finish generated order-7 recurrence (${{ matrix.shard }})
    needs:
      - order-seven-plan
      - order-seven-scalars
    if: >-
      (github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch') &&
      needs.order-seven-plan.outputs.all-hit != 'true' &&
      needs.order-seven-scalars.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: order-seven-${{ matrix.shard }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        shard:
          - r2-final
          - r4-final
          - r5-final
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build or restore the final recurrence shard
        uses: ./.github/actions/build-order-seven-shard
        with:
          shard: ${{ matrix.shard }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
