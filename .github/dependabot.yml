version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    groups:
      site-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: vinext
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "@vitejs/plugin-rsc"
        update-types:
          - "version-update:semver-minor"
    open-pull-requests-limit: 2
