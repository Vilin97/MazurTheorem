name = "mazur-torsion"
version = "0.1.0"
keywords = ["math", "elliptic-curves", "number-theory"]
defaultTargets = ["MazurTorsion"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "TauCeti"
git = "https://github.com/Vilin97/TauCeti"
rev = "de8aff326e96872ef479602ed7d9dcc1e6d9783b"

# Keep Mathlib last so its exact transitive pins override dependency manifests.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "MazurTorsion"

[[lean_lib]]
name = "EllipticCurves"
globs = ["EllipticCurves", "EllipticCurves.+"]

[[lean_lib]]
name = "Challenge"

[[lean_exe]]
name = "axioms"
root = "scripts.Axioms"

[[lean_exe]]
name = "contractAxioms"
root = "scripts.ContractAxioms"
