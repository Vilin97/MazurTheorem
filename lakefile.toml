name = "mazur-torsion"
version = "0.1.0"
keywords = ["math", "elliptic-curves", "number-theory"]
defaultTargets = ["MazurTorsion"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0-rc1"

[[lean_lib]]
name = "MazurTorsion"

[[lean_lib]]
name = "EllipticCurves"
globs = ["EllipticCurves", "EllipticCurves.+"]

[[lean_lib]]
name = "Challenge"

[[lean_exe]]
name = "axioms"
root = "scripts.Axioms"

[[lean_exe]]
name = "contractAxioms"
root = "scripts.ContractAxioms"
